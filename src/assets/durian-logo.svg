      <path d="M44 28 L47 32 L50 28" />
      <path d="M53 32 L56 35 L59 32" />

      <path d="M12 39 L15 43 L19 39" />
      <path d="M22 37 L26 42 L30 37" />
      <path d="M33 38 L37 43 L41 38" />
      <path d="M44 39 L47 44 L51 39" />
      <path d="M53 43 L56 47 L58 43" />

      <path d="M14 51 L18 55 L22 51" />
      <path d="M25 49 L29 54 L33 49" />
      <path d="M36 50 L40 55 L44 50" />
      <path d="M46 52 L49 56 L52 52" />

